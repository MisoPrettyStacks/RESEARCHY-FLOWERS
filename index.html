<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blossom 🌸 Institutional Research Terminal</title>
  <style>
    /* ===== Blossom 🌸 — Y2K kawaii desktop theme ===== */
    @import url('https://googleapis.com');

    :root {
      --ink: #2b2b3d;
      --paper: #fdfaf6;
      --pink: #ff9fc7;
      --pink-deep: #ff7fb8;
      --pink-hot: #cc0066;
      --peach: #ffc4a3;
      --purple: #cdb3f0;
      --teal: #7fe0e0;
      --blue: #9fc9f5;
      --yellow: #ffe06f;
      --soft-blue: #e8f4fd;
      --soft-pink: #ffe0f0;
      --ok: #1f9d55;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; }
    body {
      font-family: 'DM Sans', 'Trebuchet MS', Arial, sans-serif;
      color: var(--ink);
      background-color: var(--soft-pink);
    }

    /* ===== Desktop Workspace ===== */
    .desktop {
      width: 100%; height: 100vh;
      background: radial-gradient(circle, var(--soft-pink) 20%, transparent 20%),
                  radial-gradient(circle, var(--soft-blue) 20%, transparent 20%);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      position: relative; overflow: hidden;
    }

    .sparkle {
      position: absolute; pointer-events: none; font-size: 22px;
      animation: sparkle-anim 3s infinite ease-in-out;
      filter: drop-shadow(0 0 2px rgba(255,255,255,0.9));
      user-select: none;
    }
    @keyframes sparkle-anim {
      0%, 100% { opacity: 1; transform: scale(1) rotate(0deg); }
      50% { opacity: 0.3; transform: scale(1.4) rotate(180deg); }
    }

    /* ===== Desktop Window Placement & Management ===== */
    .icon-grid {
      display: flex; flex-direction: column; gap: 18px;
      padding: 18px; position: absolute; top: 6px; left: 6px; z-index: 5;
    }
    .desktop-icon {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      cursor: pointer; width: 78px;
    }
    .desktop-icon:hover .icon-label { background: var(--ink); color: #fff; }
    .icon-img {
      font-size: 26px; line-height: 1; display: flex; align-items: center; justify-content: center;
      width: 48px; height: 48px; background: var(--paper); border: 2.5px solid var(--ink);
      border-radius: 12px; box-shadow: 3px 3px 0 rgba(43,43,61,0.85);
      transition: transform 0.1s;
    }
    .desktop-icon:active .icon-img { transform: scale(0.95); }
    .icon-label {
      font-size: 11px; font-weight: 700; color: var(--ink); text-align: center;
      padding: 2px 7px; background: rgba(253,250,246,0.9); border-radius: 7px; white-space: nowrap;
      border: 1.5px solid var(--ink);
    }

    /* ===== Windows Chassis ===== */
    .win {
      position: absolute; background: var(--paper);
      border: 2.5px solid var(--ink); border-radius: 14px;
      box-shadow: 6px 6px 0 rgba(43,43,61,0.9);
      min-width: 280px; font-size: 13px; cursor: default; overflow: hidden; z-index: 10;
      display: none;
    }
    .win.open { display: flex; flex-direction: column; }
    .win-titlebar {
      padding: 10px 12px; display: flex; align-items: center; justify-content: space-between;
      cursor: move; font-size: 13px; font-weight: 700; color: var(--ink);
      letter-spacing: 0.2px; border-bottom: 2.5px solid var(--ink); user-select: none;
    }
    .tb-pink   { background: linear-gradient(90deg, #ff9fc7, #ffc4a3) !important; }
    .tb-purple { background: linear-gradient(90deg, #cdb3f0, #f0b3e0) !important; }
    .tb-teal   { background: linear-gradient(90deg, #7fe0e0, #9fc9f5) !important; }

    .win-btns { display: flex; gap: 5px; }
    .win-btn {
      width: 22px; height: 22px; border: 2px solid var(--ink); border-radius: 6px;
      font-size: 12px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-weight: bold; color: var(--ink); background: var(--paper);
      flex-shrink: 0; line-height: 1; padding-bottom: 2px;
    }
    .win-btn:hover { background: #fff; transform: translateY(-1px); }
    .win-btn:active { transform: translateY(1px); }
    .win-content { padding: 14px; color: var(--ink); overflow-y: auto; max-height: 80vh; }

    /* Custom Kawaii Scrollbars */
    .win-content::-webkit-scrollbar, .scroll-area::-webkit-scrollbar { width: 10px; }
    .win-content::-webkit-scrollbar-track, .scroll-area::-webkit-scrollbar-track { background: var(--soft-pink); border-radius: 6px; }
    .win-content::-webkit-scrollbar-thumb, .scroll-area::-webkit-scrollbar-thumb { background: var(--pink); border-radius: 6px; border: 1.5px solid var(--ink); }

    /* ===== Input Controls & Search Hub ===== */
    .search-box { display: flex; gap: 8px; margin-bottom: 4px; }
    #ticker-input { text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
    .field-label { display: block; font-weight: 700; font-size: 12px; margin: 10px 0 5px; color: var(--pink-hot); }
    .muted { color: #6b6b7a; font-weight: 400; }

    input[type="text"] {
      flex-grow: 1; border: 2px solid var(--ink); border-radius: 8px;
      padding: 8px 10px; font: inherit; font-size: 13px; background: #fff; color: var(--ink);
    }
    input:focus { outline: none; border-color: var(--pink-deep); box-shadow: 0 0 0 2px var(--soft-pink); }

    .btn {
      background: var(--paper); border: 2px solid var(--ink); border-radius: 8px;
      box-shadow: 2px 2px 0 rgba(43,43,61,0.85); padding: 7px 14px;
      font: inherit; font-size: 12px; font-weight: 700; color: var(--ink); cursor: pointer;
      transition: transform .08s;
    }
    .btn:hover { background: #fff; }
    .btn:active { transform: translate(2px,2px); box-shadow: none; }
    .btn.primary { background: var(--pink); }
    .btn.primary:hover { background: var(--pink-deep); }
    .btn.teal { background: var(--teal); }
    .btn.small { padding: 4px 9px; font-size: 11px; }

    /* ===== Specific Workspace Formatting ===== */
    #win-blossom { width: 460px; left: 120px; top: 40px; }
    #win-vault { width: 380px; left: 600px; top: 120px; }

    .providers-hint {
      font-size: 11.5px; background: var(--soft-pink); color: var(--pink-hot);
      border: 2px solid var(--pink); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px;
      line-height: 1.4;
    }
    .run-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
    .hint { font-size: 11px; }

    .result-box { margin-top: 14px; border-top: 2px dashed var(--pink); padding-top: 12px; }
    .result-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .result-head h3 { font-size: 13px; font-weight: 700; }
    .badge { font-size: 11px; background: var(--purple); color: var(--ink); padding: 2px 8px; border-radius: 999px; border: 1.5px solid var(--ink); font-weight: 700; }

    .run-log {
      font-family: 'Courier New', monospace; font-size: 11px;
      background: #1c1c24; color: #00ff88; border: 2px solid var(--ink); border-radius: 8px;
      padding: 10px; max-height: 110px; overflow-y: auto; margin-bottom: 14px;
    }
    .log-line { display: flex; gap: 6px; padding: 2px 0; align-items: center; }
    .log-icon { width: 12px; font-weight: bold; }
    .log-line.success { color: #00ff88; }
    .log-line.trying { color: var(--yellow); }
    .log-line.failed { color: #ff66a3; }

    /* Metrics Panels */
    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .metric-card {
      background: #fff; border: 2px solid var(--ink); border-radius: 10px;
      padding: 8px 10px; box-shadow: 2px 2px 0 rgba(43,43,61,0.5);
      display: flex; flex-direction: column;
    }
    .m-label { font-size: 10.5px; font-weight: 700; color: #78788a; text-transform: uppercase; }
    .m-val { font-size: 15px; font-weight: 700; color: var(--ink); margin-top: 2px; }

    .output {
      white-space: pre-wrap; word-break: break-word; font-size: 12px; margin: 0;
      font-family: monospace; background: var(--soft-blue); border: 2px solid var(--blue);
      border-radius: 10px; padding: 12px; line-height: 1.5; color: #1e2d4a;
    }
    .error-box { background: var(--soft-pink); color: var(--pink-hot); border: 2px solid var(--pink); padding: 9px 11px; border-radius: 8px; font-size: 12px; font-weight: 700; }

    .vault-intro { font-size: 12px; color: #5b5b6a; margin-bottom: 14px; line-height: 1.5; }
    .vault-list { display: grid; gap: 12px; }
    .vault-card { border: 2px solid var(--ink); border-radius: 12px; padding: 11px; background: #fff; box-shadow: 2px 2px 0 rgba(43,43,61,0.5); }
    .vault-card-head { display: flex; align-items: center; gap: 8px; }
    .vault-rank {
      width: 22px; height: 22px; border-radius: 7px; background: var(--pink); color: var(--ink);
      display: grid; place-items: center; font-size: 11px; font-weight: 700; border: 1.5px solid var(--ink);
    }
  </style>
</head>
<body>

  <div class="desktop">
    <!-- Background Sparkles -->
    <div class="sparkle" style="top: 15%; left: 45%;">✨</div>
    <div class="sparkle" style="top: 60%; left: 80%;">🌸</div>
    <div class="sparkle" style="top: 75%; left: 15%;">✨</div>

    <!-- Desktop Icons Grid -->
    <div class="icon-grid">
      <div class="desktop-icon" onclick="openWindow('win-blossom')">
        <div class="icon-img">📈</div>
        <div class="icon-label">Terminal</div>
      </div>
      <div class="desktop-icon" onclick="openWindow('win-vault')">
        <div class="icon-img">🔑</div>
        <div class="icon-label">Metrics Vault</div>
      </div>
      <div class="desktop-icon" onclick="openWindow('win-watchlist')">
        <div class="icon-img">⭐</div>
        <div class="icon-label">Watchlist</div>
      </div>
    </div>

    <!-- MAIN TERMINAL WINDOW -->
    <div id="win-blossom" class="win open">
