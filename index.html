<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Researchy Flowers 🌸 — New Constructs Forensic Engine</title>
  <style>
    /* Blossom 🌸 — Y2K kawaii desktop theme */
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap');

    :root {
      --ink: #2b2b3d;
      --paper: #fdfaf6;
      --pink: #ff9fc7;
      --pink-deep: #ff7fb8;
      --pink-hot: #cc0066;
      --peach: #ffc4a3;
      --purple: #cdb3f0;
      --teal: #7fe0e0;
      --blue: #9fc9f5;
      --yellow: #ffe06f;
      --soft-blue: #e8f4fd;
      --soft-pink: #ffe0f0;
      --ok: #1f9d55;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'DM Sans', 'Trebuchet MS', Arial, sans-serif;
      color: var(--ink);
      overflow: hidden;
      background-color: #ffe0f0;
    }

    /* ===== Desktop ===== */
    .desktop {
      width: 100%; height: 100vh;
      background: linear-gradient(135deg, #ffe0f0 0%, #e8f4fd 100%);
      position: relative; overflow: hidden;
    }

    .sparkle {
      position: absolute; pointer-events: none; font-size: 18px;
      animation: sparkle-anim 2s infinite;
      filter: drop-shadow(0 0 2px rgba(255,255,255,0.8));
    }
    @keyframes sparkle-anim {
      0%,100% { opacity: 1; transform: scale(1) rotate(0deg); }
      50% { opacity: 0.4; transform: scale(1.3) rotate(180deg); }
    }

    /* ===== Desktop icons ===== */
    .icon-grid {
      display: flex; flex-direction: column; gap: 18px;
      padding: 18px; position: absolute; top: 6px; left: 6px; z-index: 5;
    }
    .desktop-icon {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      cursor: pointer; width: 85px;
    }
    .desktop-icon:hover .icon-label { background: var(--ink); color: #fff; }
    .icon-img {
      font-size: 28px; line-height: 1; display: flex; align-items: center; justify-content: center;
      width: 46px; height: 46px; background: var(--paper); border: 2.5px solid var(--ink);
      border-radius: 12px; box-shadow: 3px 3px 0 rgba(43,43,61,0.85);
    }
    .icon-label {
      font-size: 11px; font-weight: 700; color: var(--ink); text-align: center;
      padding: 2px 7px; background: rgba(253,250,246,0.9); border-radius: 7px; white-space: nowrap;
    }

    /* ===== Windows ===== */
    .win {
      position: absolute; background: var(--paper);
      border: 2.5px solid var(--ink); border-radius: 14px;
      box-shadow: 6px 6px 0 rgba(43,43,61,0.9);
      min-width: 200px; font-size: 13px; cursor: default; overflow: hidden; z-index: 10;
      display: none;
    }
    .win.open { display: flex; flex-direction: column; }
    .win-titlebar {
      background: linear-gradient(90deg, var(--teal), var(--purple));
      padding: 8px 10px; display: flex; align-items: center; justify-content: space-between;
      cursor: grab; font-size: 13px; font-weight: 700; color: var(--ink);
      letter-spacing: 0.2px; border-bottom: 2.5px solid var(--ink); user-select: none;
    }
    .win-titlebar:active { cursor: grabbing; }
    .tb-pink   { background: linear-gradient(90deg, #ff9fc7, #ffc4a3) !important; }
    .tb-purple { background: linear-gradient(90deg, #cdb3f0, #f0b3e0) !important; }
    .tb-teal   { background: linear-gradient(90deg, #7fe0e0, #9fc9f5) !important; }
    .tb-yellow { background: linear-gradient(90deg, #ffe06f, #ffc4a3) !important; }

    .win-btns { display: flex; gap: 5px; }
    .win-btn {
      width: 20px; height: 20px; border: 2px solid var(--ink); border-radius: 5px;
      font-size: 11px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-weight: bold; color: var(--ink); background: var(--paper);
      flex-shrink: 0; line-height: 1;
    }
    .win-btn:hover { background: #fff; transform: translateY(-1px); }
    .win-content { padding: 14px; color: var(--ink); overflow-y: auto; }

    /* Custom kawaii scrollbars */
    .win-content::-webkit-scrollbar, .scroll-area::-webkit-scrollbar { width: 10px; }
    .win-content::-webkit-scrollbar-track, .scroll-area::-webkit-scrollbar-track { background: var(--soft-pink); border-radius: 6px; }
    .win-content::-webkit-scrollbar-thumb, .scroll-area::-webkit-scrollbar-thumb { background: var(--pink); border-radius: 6px; border: 1px solid var(--ink); }

    /* ===== Form controls (kawaii) ===== */
    .field-label { display: block; font-weight: 700; font-size: 12px; margin: 10px 0 5px; color: var(--pink-hot); }
    .field-label:first-child { margin-top: 0; }
    .muted { color: #8a8a9a; font-weight: 400; }

    textarea, input[type="text"], input[type="password"], select {
      width: 100%; border: 2px solid var(--ink); border-radius: 8px;
      padding: 7px 9px; font: inherit; font-size: 12.5px; background: #fff; color: var(--ink);
    }
    textarea { resize: vertical; }
    textarea:focus, input:focus, select:focus { outline: none; border-color: var(--pink-deep); box-shadow: 0 0 0 2px var(--soft-pink); }

    .btn {
      background: var(--paper); border: 2px solid var(--ink); border-radius: 8px;
      box-shadow: 2px 2px 0 rgba(43,43,61,0.85); padding: 6px 12px;
      font: inherit; font-size: 12px; font-weight: 700; color: var(--ink); cursor: pointer;
      transition: transform .08s;
    }
    .btn:hover { background: #fff; }
    .btn:active { transform: translate(2px,2px); box-shadow: none; }
    .btn.primary { background: var(--pink); }
    .btn.primary:hover { background: var(--pink-deep); }
    .btn.primary:disabled { opacity: .55; cursor: default; transform: none; box-shadow: 2px 2px 0 rgba(43,43,61,0.4); }
    .btn.teal { background: var(--teal); }
    .btn.small { padding: 4px 9px; font-size: 11px; }
    
    .icon-btn {
      border: 2px solid var(--ink); background: var(--paper); border-radius: 7px;
      width: 28px; height: 26px; cursor: pointer; font-size: 11px; color: var(--ink);
      box-shadow: 1px 1px 0 rgba(43,43,61,0.6);
    }
    .icon-btn:hover { background: #fff; }
    .icon-btn:disabled { opacity: .35; cursor: default; }

    /* ===== Blossom Pipeline Custom Layout Adjustments ===== */
    #win-blossom { width: 460px; left: 140px; top: 30px; }
    #win-blossom .win-content { max-height: 80vh; }

    .providers-hint {
      font-size: 12px; background: var(--soft-pink); color: var(--pink-hot);
      border: 2px solid var(--pink); border-radius: 8px; padding: 7px 10px; margin-bottom: 10px;
    }
    .providers-hint.warn { background: #fff7d6; border-color: var(--yellow); color: #9a6b00; }

    .run-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .hint { font-size: 11px; }

    .result-box { margin-top: 14px; border-top: 2px dashed var(--pink); padding-top: 12px; }
    .result-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .result-head h3 { font-size: 13px; }
    .badge { font-size: 11px; background: var(--purple); color: var(--ink); padding: 3px 9px; border-radius: 999px; border: 1.5px solid var(--ink); }

    .run-log {
      font-family: 'Courier New', monospace; font-size: 11.5px;
      background: #16161f; color: #00ff88; border: 2px solid var(--ink); border-radius: 8px;
      padding: 9px; max-height: 150px; overflow: auto; margin-bottom: 10px;
    }
    .log-line { display: flex; gap: 8px; padding: 1px 0; }
    .log-icon { width: 14px; text-align: center; }
    .log-line.success { color: #00ff88; }
    .log-line.failed, .log-line.rate_limited { color: #ff80bf; }
    .log-line.trying { color: #ffe06f; }

    .output {
      white-space: pre-wrap; word-break: break-word; font-size: 13px; margin: 0;
      font-family: inherit; background: var(--soft-blue); border: 2px solid var(--blue);
      border-radius: 10px 10px 10px 2px; padding: 10px 12px;
    }
    
    /* ===== Vault / Models Layout Adjustments ===== */
    #win-vault { width: 400px; left: 630px; top: 50px; }
    #win-vault .win-content { max-height: 80vh; }
    .vault-intro { font-size: 11.5px; color: #6b6b7a; margin-bottom: 12px; line-height: 1.5; }
    .vault-list { display: grid; gap: 12px; }
    .vault-card { border: 2px solid var(--ink); border-radius: 12px; padding: 11px; background: #fff; box-shadow: 2px 2px 0 rgba(43,43,61,0.5); }
    .vault-card-head { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
    .vault-title-group { display: flex; align-items: center; gap: 6px; }
    .vault-rank {
      width: 22px; height: 22px; border-radius: 7px; background: var(--pink); color: var(--ink);
      display: grid; place-items: center; font-size: 11px; font-weight: 700; border: 1.5px solid var(--ink);
    }
    .vault-ticker { font-weight: 700; font-size: 13px; }
    .vault-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; font-size: 11.5px; background: var(--paper); padding: 6px; border-radius: 6px; border: 1px solid var(--ink); }
  </style>
</head>
<body>

<div class="desktop">
  
  <!-- Sparkles -->
  <div class="sparkle" style="top:20%; left:40%;">✨</div>
  <div class="sparkle" style="top:70%; left:15%;">🌸</div>
  <div class="sparkle" style="top:15%; left:85%;">✨</div>
  <div class="sparkle" style="top:80%; left:75%;">🌸</div>

  <!-- Icon Grid -->
  <div class="icon-grid">
    <div class="desktop-icon" onclick="openWindow('win-blossom')">
      <div class="icon-img">🔍</div>
      <div class="icon-label">Forensic Engine</div>
    </div>
    <div class="desktop-icon" onclick="openWindow('win-vault')">
      <div class="icon-img">📊</div>
      <div class="icon-label">Asset Models</div>
    </div>
    <div class="desktop-icon" onclick="openWindow('win-finsights')">
      <div class="icon-img">💬</div>
      <div class="icon-label">FinSights AI</div>
    </div>
    <div class="desktop-icon" onclick="openWindow('win-delivery')">
      <div class="icon-img">📈</div>
      <div class="icon-label">Product Delivery</div>
